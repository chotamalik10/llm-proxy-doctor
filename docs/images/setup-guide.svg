<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650"><rect width="1440" height="650" rx="24" fill="#0b1220"/><text x="70" y="80" fill="#54d6a0" font-family="Arial" font-size="14" letter-spacing="2">QUICK START</text><text x="70" y="135" fill="#f8fafc" font-family="Arial" font-size="38" font-weight="bold">Run your first proxy health check</text><rect x="70" y="190" width="1300" height="355" rx="18" fill="#111827" stroke="#334155"/><path d="M70 214a24 24 0 0 1 24-24h1252a24 24 0 0 1 24 24v42H70z" fill="#1e293b"/><circle cx="105" cy="224" r="8" fill="#fb7185"/><circle cx="133" cy="224" r="8" fill="#fbbf24"/><circle cx="161" cy="224" r="8" fill="#4ade80"/><text x="720" y="230" fill="#cbd5e1" text-anchor="middle" font-family="Arial" font-size="16">PowerShell / Terminal</text><g font-family="Consolas,monospace" font-size="22"><text x="115" y="315" fill="#94a3b8"># 1. Clone the repository</text><text x="115" y="354" fill="#f8fafc">git clone https://github.com/chotamalik10/llm-proxy-doctor.git</text><text x="115" y="410" fill="#94a3b8"># 2. Set your key only if the endpoint requires one</text><text x="115" y="449" fill="#f8fafc">$env:OPENAI_API_KEY = "your-api-key"</text><text x="115" y="505" fill="#94a3b8"># 3. Run a diagnostic (replace URL and model)</text><text x="115" y="535" fill="#54d6a0">python doctor.py --url "http://localhost:8000/v1" --model "your-model"</text></g><text x="70" y="590" fill="#94a3b8" font-family="Arial" font-size="14">No third-party Python packages required · Use only endpoints you own or are authorized to test · Never commit API keys</text></svg>