<text x="600" y="47" text-anchor="middle" fill="#CBD5E1" font-family="Arial,sans-serif" font-size="18">LLM Proxy Doctor · Terminal Preview</text>
<text x="46" y="119" fill="#54D6A0" font-family="Arial,sans-serif" font-size="23" font-weight="700">01 · COMMAND LINE HELP</text>
<text x="46" y="143" fill="#94A3B8" font-family="Arial,sans-serif" font-size="15">See available options before running a diagnostic.</text>
<text x="46" y="158" fill="#F8FAFC" font-family="Consolas,Menlo,monospace" font-size="21">$ python doctor.py --help</text><text x="46" y="201" fill="#D8E1EF" font-family="Consolas,Menlo,monospace" font-size="21">usage: llm-proxy-doctor [-h] [--url URL] [--model MODEL]</text><text x="46" y="244" fill="#D8E1EF" font-family="Consolas,Menlo,monospace" font-size="21">                         [--timeout TIMEOUT] [--stream] [--skip-models]</text><text x="46" y="287" fill="#94A3B8" font-family="Consolas,Menlo,monospace" font-size="21">Diagnose an OpenAI-compatible LLM API proxy.</text><text x="46" y="330" fill="#CBD5E1" font-family="Consolas,Menlo,monospace" font-size="21">--url       API base URL</text><text x="46" y="373" fill="#CBD5E1" font-family="Consolas,Menlo,monospace" font-size="21">--model     Model identifier to test</text><text x="46" y="416" fill="#CBD5E1" font-family="Consolas,Menlo,monospace" font-size="21">--stream    Also verify SSE streaming</text>
<text x="46" y="414" fill="#64748B" font-family="Arial,sans-serif" font-size="14">Illustrative preview • actual latency and provider responses will vary</text>
