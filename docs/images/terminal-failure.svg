<text x="600" y="47" text-anchor="middle" fill="#CBD5E1" font-family="Arial,sans-serif" font-size="18">LLM Proxy Doctor · Terminal Preview</text>
<text x="46" y="119" fill="#FCA5A5" font-family="Arial,sans-serif" font-size="23" font-weight="700">03 · TROUBLESHOOTING OUTPUT</text>
<text x="46" y="143" fill="#94A3B8" font-family="Arial,sans-serif" font-size="15">Example of a connection failure with an actionable message.</text>
<text x="46" y="184" fill="#F8FAFC" font-family="Consolas,Menlo,monospace" font-size="21">$ python doctor.py --url http://localhost:8000/v1 --model auto</text>
<text x="46" y="227" fill="#CBD5E1" font-family="Consolas,Menlo,monospace" font-size="21">LLM Proxy Doctor v2.0.0</text>
<text x="46" y="270" fill="#CBD5E1" font-family="Consolas,Menlo,monospace" font-size="21">Endpoint : http://localhost:8000/v1</text>
<text x="46" y="313" fill="#CBD5E1" font-family="Consolas,Menlo,monospace" font-size="21">Model    : auto</text>
<text x="46" y="356" fill="#FB7185" font-family="Consolas,Menlo,monospace" font-size="21">[FAIL] GET /models</text>
<text x="46" y="399" fill="#FCA5A5" font-family="Consolas,Menlo,monospace" font-size="21">       Connection failed: [Errno 111] Connection refused</text>
<text x="46" y="442" fill="#FB7185" font-family="Consolas,Menlo,monospace" font-size="21">[FAIL] POST /chat/completions</text>
<text x="46" y="480" fill="#64748B" font-family="Arial,sans-serif" font-size="14">Illustrative preview • actual latency and provider responses will vary</text>
</svg>