<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600"><rect width="1440" height="600" rx="24" fill="#0b1220"/><text x="70" y="80" fill="#54d6a0" font-family="Arial" font-size="14" letter-spacing="2">HOW IT WORKS</text><text x="70" y="135" fill="#f8fafc" font-family="Arial" font-size="38" font-weight="bold">A transparent, read-only diagnostic flow</text><g font-family="Arial"><rect x="70" y="220" width="330" height="210" rx="18" fill="#111c2e" stroke="#334155"/><text x="105" y="270" fill="#54d6a0" font-size="15" font-weight="bold">01 · INPUT</text><text x="105" y="315" fill="#f8fafc" font-size="24" font-weight="bold">Your CLI settings</text><text x="105" y="352" fill="#94a3b8" font-size="16">Base URL · model · timeout</text><text x="105" y="380" fill="#94a3b8" font-size="16">API key from environment</text><rect x="555" y="220" width="330" height="210" rx="18" fill="#111c2e" stroke="#334155"/><text x="590" y="270" fill="#54d6a0" font-size="15" font-weight="bold">02 · REQUESTS</text><text x="590" y="315" fill="#f8fafc" font-size="24" font-weight="bold">API checks</text><text x="590" y="352" fill="#94a3b8" font-size="16">GET /models (optional)</text><text x="590" y="380" fill="#94a3b8" font-size="16">POST /chat/completions</text><rect x="1040" y="220" width="330" height="210" rx="18" fill="#111c2e" stroke="#334155"/><text x="1075" y="270" fill="#54d6a0" font-size="15" font-weight="bold">03 · REPORT</text><text x="1075" y="315" fill="#f8fafc" font-size="24" font-weight="bold">Readable results</text><text x="1075" y="352" fill="#94a3b8" font-size="16">PASS / FAIL · latency</text><text x="1075" y="380" fill="#94a3b8" font-size="16">HTTP / timeout detail</text><path d="M400 325h155m-12-12 12 12-12 12M885 325h155m-12-12 12 12-12 12" fill="none" stroke="#54d6a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="70" y="475" width="1300" height="70" rx="12" fill="#132338" stroke="#29415c"/><text x="100" y="517" fill="#d8e1ef" font-size="16">No provider configuration is changed. No credentials are saved. A small test prompt is sent only to the endpoint you specify.</text></g></svg>